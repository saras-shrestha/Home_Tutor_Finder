```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Choose Your Role | TutorFinder</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f5f7fb;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        /* MAIN CONTAINER */

        .role-container {
            width: 900px;
            max-width: 100%;

            background: #ffffff;

            border-radius: 24px;

            padding: 55px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.08);

            text-align: center;
        }


        /* LOGO */

        .logo {
            font-size: 27px;
            font-weight: 700;

            color: #4f46e5;

            margin-bottom: 35px;
        }


        /* HEADING */

        .role-container h1 {
            font-size: 34px;

            color: #1f2937;

            margin-bottom: 12px;
        }

        .subtitle {
            color: #6b7280;

            font-size: 16px;

            margin-bottom: 40px;
        }


        /* ROLE CARDS */

        .roles {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 25px;

            margin-bottom: 35px;
        }


        .role-card {
            position: relative;

            border: 2px solid #e5e7eb;

            border-radius: 18px;

            padding: 35px 25px;

            cursor: pointer;

            transition:
                border-color 0.25s ease,
                transform 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }


        .role-card:hover {
            transform: translateY(-4px);

            border-color: #a5b4fc;

            box-shadow:
                0 10px 25px rgba(79, 70, 229, 0.08);
        }


        /* HIDE RADIO */

        .role-card input {
            position: absolute;

            opacity: 0;

            pointer-events: none;
        }


        /* ICON */

        .role-icon {
            width: 75px;
            height: 75px;

            margin: 0 auto 20px;

            border-radius: 18px;

            background: #eef2ff;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 36px;

            transition: 0.25s;
        }


        /* CARD TITLE */

        .role-card h2 {
            color: #1f2937;

            font-size: 22px;

            margin-bottom: 10px;
        }


        .role-card p {
            color: #6b7280;

            font-size: 14px;

            line-height: 1.6;
        }


        /* SELECTED CARD */

        .role-card.selected {
            border-color: #4f46e5;

            background: #f8f8ff;

            box-shadow:
                0 10px 30px rgba(79, 70, 229, 0.12);
        }


        .role-card.selected .role-icon {
            background: #4f46e5;

            transform: scale(1.05);
        }


        /* CHECK MARK */

        .check {
            position: absolute;

            top: 15px;
            right: 15px;

            width: 28px;
            height: 28px;

            border-radius: 50%;

            background: #4f46e5;

            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 15px;

            opacity: 0;

            transform: scale(0.5);

            transition: 0.25s;
        }


        .role-card.selected .check {
            opacity: 1;

            transform: scale(1);
        }


        /* CONTINUE BUTTON */

        .continue-btn {
            width: 300px;

            max-width: 100%;

            padding: 14px 25px;

            border: none;

            border-radius: 10px;

            background: #4f46e5;

            color: white;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }


        .continue-btn:hover {
            background: #4338ca;

            transform: translateY(-1px);
        }


        .continue-btn:disabled {
            background: #c7c9d9;

            cursor: not-allowed;

            transform: none;
        }


        /* MESSAGE */

        .message {
            min-height: 20px;

            margin-top: 15px;

            font-size: 14px;

            color: #dc2626;
        }


        /* LOGIN */

        .login-text {
            margin-top: 30px;

            color: #6b7280;

            font-size: 14px;
        }


        .login-text a {
            color: #4f46e5;

            text-decoration: none;

            font-weight: 600;
        }


        .login-text a:hover {
            text-decoration: underline;
        }


        /* RESPONSIVE */

        @media (max-width: 700px) {

            body {
                padding: 15px;
            }

            .role-container {
                padding: 35px 20px;
            }

            .role-container h1 {
                font-size: 28px;
            }

            .roles {
                grid-template-columns: 1fr;
            }

        }


        @media (max-width: 400px) {

            .role-container {
                padding: 30px 15px;
            }

            .role-card {
                padding: 28px 18px;
            }

        }

    </style>

</head>


<body>


    <div class="role-container">


        <!-- LOGO -->

        <div class="logo">
            TutorFinder
        </div>


        <!-- HEADING -->

        <h1>
            Create your account
        </h1>

        <p class="subtitle">
            How would you like to use TutorFinder?
        </p>


        <!-- ROLE CARDS -->

        <div class="roles">


            <!-- STUDENT -->

            <label class="role-card" data-role="student">

                <input
                    type="radio"
                    name="role"
                    value="student"
                >

                <div class="check">
                    ✓
                </div>

                <div class="role-icon">
                    🎓
                </div>

                <h2>
                    Student
                </h2>

                <p>
                    Find qualified tutors and get
                    personalized help with your studies.
                </p>

            </label>


            <!-- TUTOR -->

            <label class="role-card" data-role="tutor">

                <input
                    type="radio"
                    name="role"
                    value="tutor"
                >

                <div class="check">
                    ✓
                </div>

                <div class="role-icon">
                    👨‍🏫
                </div>

                <h2>
                    Tutor
                </h2>

                <p>
                    Share your knowledge, teach students
                    and grow your tutoring opportunities.
                </p>

            </label>


        </div>


        <!-- CONTINUE -->

        <button
            type="button"
            class="continue-btn"
            id="continueBtn"
            disabled
        >
            Continue →
        </button>


        <div
            class="message"
            id="message"
        ></div>


        <!-- LOGIN -->

        <div class="login-text">

            Already have an account?

            <a href="/accounts/login/">
                Login
            </a>

        </div>


    </div>


    <script>

        const roleCards =
            document.querySelectorAll(".role-card");

        const continueBtn =
            document.getElementById("continueBtn");

        const message =
            document.getElementById("message");


        let selectedRole = null;


        /*
        -----------------------------------------
        SELECT ROLE
        -----------------------------------------
        */

        roleCards.forEach(card => {

            card.addEventListener("click", function () {

                // Remove selected class from all cards

                roleCards.forEach(item => {
                    item.classList.remove("selected");
                });


                // Add selected class

                this.classList.add("selected");


                // Get selected role

                const radio =
                    this.querySelector("input");

                radio.checked = true;


                selectedRole =
                    radio.value;


                // Enable button

                continueBtn.disabled = false;


                // Clear message

                message.textContent = "";

            });

        });


        /*
        -----------------------------------------
        CONTINUE BUTTON
        -----------------------------------------
        */

        continueBtn.addEventListener("click", function () {

            if (!selectedRole) {

                message.textContent =
                    "Please select Student or Tutor.";

                return;
            }


            /*
            Save the selected role.

            This can be used by the next
            Django registration page.
            */

            localStorage.setItem(
                "selectedRole",
                selectedRole
            );


            /*
            Redirect according to role
            */

            if (selectedRole === "student") {

                window.location.href =
                    "/accounts/register/?role=student";

            }

            else if (selectedRole === "tutor") {

                window.location.href =
                    "/accounts/register/?role=tutor";

            }

        });

    </script>


</body>

</html>
```
